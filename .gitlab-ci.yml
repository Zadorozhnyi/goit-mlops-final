# Assumes the GitLab Runner executing these jobs can reach the cluster
# network directly (e.g. a runner registered from inside EKS, same as
# MLFLOW_TRACKING_URI's default in-cluster DNS name) - simpler than exposing
# MLflow through a public Ingress just so a SaaS runner can reach it. See
# README.md "Accessing MLflow" for the two options and why this one was
# picked.

stages:
  - lint
  - test
  - security
  - train
  - promote
  - rollback

variables:
  MLFLOW_TRACKING_URI: "http://mlflow-tracking-tracking.mlops-system.svc.cluster.local:5000"
  MODEL_NAME: "iris-classifier"

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - ruff check training/ inference/ scripts/
    - black --check training/ inference/ scripts/
    - yamllint -c .yamllint.yaml rbac/ .gitlab-ci.yml

test-training:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r training/requirements.txt -r requirements-dev.txt
  script:
    # Fully local (sqlite-backed MLflow, no cluster/network) - see
    # training/tests/test_training_integration.py for why that's enough to
    # exercise the real register -> tag -> Staging path.
    - python -m pytest training/tests/ -v

test-inference:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r inference/app/requirements.txt -r requirements-dev.txt
  script:
    - python -m pytest inference/tests/ -v

scan-inference-image:
  stage: security
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t inference:scan inference/
    # Fail the pipeline on HIGH/CRITICAL findings - anything lower is
    # logged but doesn't block (see the table Trivy prints either way).
    - trivy image --severity HIGH,CRITICAL --exit-code 1 inference:scan

train-model:
  stage: train
  image: python:3.12-slim
  # Manual, not "on every push": this job needs a runner that can reach the
  # cluster's internal DNS (see the note at the top of this file) - a plain
  # GitLab SaaS runner can't, so auto-running it on every push would just
  # fail the pipeline for anyone without that runner registered yet.
  when: manual
  before_script:
    - pip install -r training/requirements.txt
  script:
    - python training/train_and_push.py
    # New versions always land in Staging - see training/train_and_push.py.
    # Nobody has to remember to run a separate "register" step.

promote-to-production:
  stage: promote
  image: python:3.12-slim
  # Manual on purpose - Block B2 wants promotion to be a deliberate action,
  # not something that happens automatically just because training succeeded.
  when: manual
  before_script:
    - pip install mlflow==3.3.2
  script:
    - python scripts/promote_model.py --model "$MODEL_NAME" --latest-staging

rollback-production:
  stage: rollback
  image: python:3.12-slim
  when: manual
  before_script:
    - pip install mlflow==3.3.2
  script:
    - python scripts/rollback.py --model "$MODEL_NAME"
    - echo "Now restart the production pods so they pick up the change:"
    - echo "kubectl rollout restart deployment -n production -l app=inference"
