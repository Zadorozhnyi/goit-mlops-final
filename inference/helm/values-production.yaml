# Production runs two full copies (blue/green), each pinned to an explicit
# MLflow model *version* rather than a stage - that decouples "what's
# currently in the Production stage" from "what each slot is serving", which
# is what makes a blue/green switch possible: you can stand up the candidate
# in the idle slot, check it, and only then flip traffic to it.
#
# activeSlot picks which one the Service actually routes to. Flipping it
# (and committing that one-line change) is the whole deployment switch;
# reverting the commit is the whole rollback (Block B3/B4).
#
# replicas: 1 per slot, not 2 - t3.small nodes hit their hard 11-pods/node
# ENI limit with everything else already running (ArgoCD, mlflow stack,
# kube-prometheus-stack, Loki/Promtail, node-exporter/kube-proxy/vpc-cni
# DaemonSets). 2 nodes' worth of headroom isn't there without either a
# bigger node group or an AWS vCPU quota increase - see README.md.

image:
  repository: 121861012741.dkr.ecr.us-east-1.amazonaws.com/mlops-final/inference
  tag: latest

modelName: iris-classifier
mlflowTrackingUri: "http://mlflow-tracking-tracking.mlops-system.svc.cluster.local:5000"
rateLimit: "120/minute"

activeSlot: green

slots:
  - name: blue
    modelVersion: "2"
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  - name: green
    modelVersion: "3"
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
